<section class="py-24 bg-surface min-h-screen" id="gallery">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex flex-col md:flex-row justify-between items-end gap-6 mb-12">
      <div>
        <h2 class="text-4xl font-headline text-primary mb-2">{{envs.GALLERY_PAGE_TITLE}}</h2>
        <p class="text-on-surface-variant">{{envs.GALLERY_PAGE_DESCRIPTION}}</p>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      @for (item of photoContent; track item.urlPhoto) {
        <photo-card
          [demo]="item.demo",
          [urlPhoto]="item.urlPhoto"
        />
      }
    </div>
  </div>
</section>
