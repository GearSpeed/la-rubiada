<header class="relative h-screen overflow-hidden">
  <img alt="" class="absolute inset-0 w-full h-full object-cover sepia-[.75]" data-alt="sweeping landscape of a historic Spanish hacienda garden at sunrise with golden light filtering through ancient oak trees" src="./images/Rubiada/007.png"/>
  <div class="absolute inset-0 hero-gradient backdrop-blur-[2px] z-10"></div>

  <div class="absolute inset-0 z-20 flex items-center justify-center p-4">
    <div class="text-center max-w-4xl">
      <div class="mb-8 inline-block">
        <img alt="" class="w-42 h-42 md:w-72 md:h-72 object-contain drop-shadow-[0_30px_40px_rgba(0,0,0,0.65)]" data-alt="elegant hand-carved wooden family crest featuring classic heraldic symbols and a fleur-de-lis on a rustic textured surface" src="{{dict.ESCUDO_APELLIDO_RUBIO}}"/>
      </div>
      <h1 class="text-5xl md:text-8xl font-serif italic text-white mb-6 tracking-tighter drop-shadow-[0_12px_24px_rgba(0,0,0,1)]">{{dict.SIDE_MENU_TITLE_RUBIADA}}</h1>
      <p class="text-xl md:text-2xl font-headline italic text-amber-400 drop-shadow-[0_8px_16px_rgba(0,0,0,1)]">"{{dict.HERO_PAGE_MOTTO}}"</p>
    </div>
  </div>

  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 z-20">
    <p class="text-on-primary font-body tracking-[0.2em] text-gray-500 uppercase md:text-sm text-[5px] opacity-90">{{dict.HERO_PAGE_HOSTED}}</p>
  </div>
</header>
