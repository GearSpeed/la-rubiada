<div class="flex md:hidden w-full items-center gap-4">
  <span class="material-symbols-outlined text-[#72563e] cursor-pointer select-none" (click)="toggleMenu()">
    {{ menuOpen() ? 'close' : 'menu' }}
  </span>
</div>

@if (menuOpen()) {
  <div class="fixed left-0 right-0 top-16 z-50 md:hidden bg-[#fff8f4]/95 backdrop-blur-md border-t border-[#d4c4b7]/20 shadow-lg">
    <div class="flex flex-col items-center text-center px-8 py-6 gap-5">
      @for (item of menuOptions; track item.route) {
        <a
          [routerLink]="item.route"
          (click)="closeMenu()"
          routerLinkActive="text-[#775a19] font-bold"
          class="text-[#211a15]/70 hover:text-[#72563e] font-serif tracking-widest uppercase text-sm transition-all duration-300"
        >
          {{ item.label }}
        </a>
      }
    </div>
  </div>
}
